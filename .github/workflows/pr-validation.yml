# Fast PR checks: lint, compile, static analysis
# Runs on every PR to catch issues before full CI

name: PR Validation

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn -B compile --file src/backend/pom.xml

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/frontend/spa/package-lock.json
      - run: npm ci
        working-directory: src/frontend/spa
      - run: npx vue-tsc --noEmit
        working-directory: src/frontend/spa