# CI: build + test on every push/PR
# Covers Java Spring Boot backend and Vue frontend

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn -B clean package --file src/backend/pom.xml
      - run: mvn -B test --file src/backend/pom.xml

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/frontend/spa/package-lock.json
      - run: npm ci
        working-directory: src/frontend/spa
      - run: npm run build
        working-directory: src/frontend/spa
      - run: npx vitest run
        working-directory: src/frontend/spa